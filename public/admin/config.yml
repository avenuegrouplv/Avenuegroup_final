                          - { name: subtitle, label: "Apakšvirsraksts", widget: string }
                          - { name: suffix, label: "Sufikss 1", widget: string, required: false }
                          - { name: suffix2, label: "Sufikss 2", widget: string, required: false }
                          - { name: desc, label: "Apraksts", widget: text }
                          - { name: listPrefix, label: "Saraksta prefikss", widget: string, required: false }
                          - name: items
                            label: "Punkti / Items"
                            widget: list
                            fields:
                              - { name: title, label: "Virsraksts", widget: string }
                              - { name: desc, label: "Apraksts", widget: text }
                      - name: en
                        label: "English (EN)"
                        widget: object
                        required: false
                        fields:
                          - { name: title, label: "Title", widget: string }
                          - { name: subtitle, label: "Subtitle", widget: string }
                          - { name: suffix, label: "Suffix 1", widget: string, required: false }
                          - { name: suffix2, label: "Suffix 2", widget: string, required: false }
                          - { name: desc, label: "Description", widget: text }
                          - { name: listPrefix, label: "List Prefix", widget: string, required: false }
                          - name: items
                            label: "Items"
                            widget: list
                            fields:
                              - { name: title, label: "Title", widget: string }
                              - { name: desc, label: "Description", widget: text }
                      - name: ru
                        label: "Русский (RU)"
                        widget: object
                        required: false
                        fields:
                          - { name: title, label: "Заголовок", widget: string }
                          - { name: subtitle, label: "Подзаголовок", widget: string }
                          - { name: suffix, label: "Суффикс 1", widget: string, required: false }
                          - { name: suffix2, label: "Суффикс 2", widget: string, required: false }
                          - { name: desc, label: "Описание", widget: text }
                          - { name: listPrefix, label: "Префикс списка", widget: string, required: false }
                          - name: items
                            label: "Элементы"
                            widget: list
                            fields:
