backend:
  name: git-gateway
  branch: main

publish_mode: simple
media_folder: "public/images/uploads"
public_folder: "/images/uploads"
locale: "en"

collections:
  - name: "content"
    label: "Satura Vadība / Content Management"
    files:
      # 1. Homepage
      - name: "homepage"
        label: "Sākumlapa / Homepage"
        file: "src/data/content/homepage.json"
        fields:
          - name: hero
            label: "Hero Sadaļa"
            widget: object
            fields:
              - { name: image, label: "Attēls", widget: image, required: false }
              - name: translations
                label: "Tulkojumi / Translations"
                widget: object
                fields:
                  - name: lv
                    label: "Latviešu (LV)"
                    widget: object
                    required: false
                    fields:
                      - { name: title, label: "Virsraksts", widget: string }
                      - { name: subtitle, label: "Apakšvirsraksts", widget: string }
                      - { name: description, label: "Apraksts", widget: text }
                      - { name: contactBtn, label: "Kontaktu poga", widget: string }
                      - { name: servicesBtn, label: "Pakalpojumu poga", widget: string }
                  - name: en
                    label: "English (EN)"
                    widget: object
                    required: false
                    fields:
                      - { name: title, label: "Title", widget: string }
                      - { name: subtitle, label: "Subtitle", widget: string }
                      - { name: description, label: "Description", widget: text }
                      - { name: contactBtn, label: "Contact Button", widget: string }
                      - { name: servicesBtn, label: "Services Button", widget: string }
                  - name: ru
                    label: "Русский (RU)"
                    widget: object
                    required: false
                    fields:
                      - { name: title, label: "Заголовок", widget: string }
                      - { name: subtitle, label: "Подзаголовок", widget: string }
                      - { name: description, label: "Описание", widget: text }
                      - { name: contactBtn, label: "Кнопка контактов", widget: string }
                      - { name: servicesBtn, label: "Кнопка услуг", widget: string }
                  - name: de
                    label: "Deutsch (DE)"
                    widget: object
                    required: false
                    fields:
                      - { name: title, label: "Titel", widget: string }
                      - { name: subtitle, label: "Untertitel", widget: string }
                      - { name: description, label: "Beschreibung", widget: text }
                      - { name: contactBtn, label: "Kontakt-Button", widget: string }
                      - { name: servicesBtn, label: "Dienste-Button", widget: string }

