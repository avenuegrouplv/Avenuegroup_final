                        label: "Deutsch (DE)"
                        widget: object
                        required: false
                        fields:
                          - { name: title, label: "Titel", widget: string }
                          - { name: subtitle, label: "Untertitel", widget: string }
                          - name: items
                            label: "Elemente"
                            widget: list
                            fields:
