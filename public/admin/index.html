<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avenue Group CMS - Satura pārvaldības sistēma</title>
  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  
  <!-- Oficiālie un autentiskie mājaslapas fonti no Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Offside&family=Space+Grotesk:wght@300;400;500;600;700&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    /* Custom Login Page Styling */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #141414;
      font-family: "Space Grotesk", sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }

    #custom-login-container {
      display: none;
      width: 100%;
      height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #141414;
      background-image: radial-gradient(circle at 50% 50%, #1e1e1e 0%, #141414 100%);
      padding: 20px;
      box-sizing: border-box;
    }

    body.cms-logged-out #custom-login-container {
      display: flex !important;
    }

    body.cms-logged-out #nc-root {
      display: none !important;
    }

    .login-card {
      background-color: #1c1c1e;
      border: 1px solid rgba(179, 130, 7, 0.3);
      padding: 3.5rem 2.5rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background-color: #b38207;
    }

    .login-logo {
      font-family: "Offside", sans-serif;
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }

    .login-logo span {
      color: #b38207;
    }

    .login-subtitle {
      font-family: "Space Grotesk", sans-serif;
      font-size: 0.85rem;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 3rem;
      font-weight: 500;
    }

    .btn-login {
      background-color: #b38207;
      color: #141414;
      border: none;
      width: 100%;
      padding: 1.1rem;
      font-family: "Space Grotesk", sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(179, 130, 7, 0.2);
    }

    .btn-login:hover {
      background-color: #d49c12;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(179, 130, 7, 0.3);
    }

    /* Netlify Widget Iframe Custom Overrides to fit styling */
    #netlify-identity-widget {
      z-index: 99999 !important;
    }
  </style>
</head>
<body class="cms-logged-out">

  <!-- Custom Beautiful Login Screen -->
  <div id="custom-login-container">
    <div class="login-card">
      <div class="login-logo">AVENUE <span>GROUP</span></div>
      <div class="login-subtitle">Satura Pārvaldības Sistēma</div>
      
      <button id="custom-login-btn" class="btn-login">Pieslēgties</button>
    </div>
  </div>

  <!-- Decap CMS UI Root -->
  <div id="nc-root"></div>

  <!-- JS-YAML to parse inline configuration without network requests -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- Embedded CMS Configuration directly inside HTML to bypass NetworkError/CORS/proxy blocks entirely -->
  <script type="text/yaml" id="cms-config">
backend:
  name: git-gateway
  branch: main

publish_mode: simple
media_folder: "public/images"
public_folder: "/images"

# Internationalization settings matching the site's locales
i18n:
  structure: single_file
  locales: [lv, en, ru]
  default_locale: lv

collections:
  # 1. Site translations & copy
  - name: "translations"
    label: "Mājaslapas Saturs un Teksti"
    i18n: true
    files:
      - name: "site_texts"
        label: "Visi Mājaslapas Teksti"
        file: "src/data/translations.json"
        fields:
          # Navigation
          - label: "Navigācijas Izvēlne"
            name: "nav"
            widget: "object"
            fields:
              - { label: "Sākums", name: "home", widget: "string" }
              - { label: "Par mums", name: "about", widget: "string" }
              - { label: "Pakalpojumi", name: "services", widget: "string" }
              - { label: "Līgumu paraugi", name: "templates", widget: "string" }
              - { label: "BUJ (FAQ)", name: "faq", widget: "string" }
              - { label: "Kontakti", name: "contact", widget: "string" }

          # Hero section
          - label: "Galvenā (Hero) Sadaļa"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Virsraksts (Rinda 1)", name: "title", widget: "string" }
              - { label: "Virsraksts (Rinda 2)", name: "subtitle", widget: "string" }
              - { label: "Apraksts", name: "description", widget: "text" }
              - { label: "Pogas Teksts - Kontakti", name: "contactBtn", widget: "string" }
              - { label: "Pogas Teksts - Pakalpojumi", name: "servicesBtn", widget: "string" }

          # Footer section
          - label: "Kājene (Footer)"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Par Mums Virsraksts", name: "aboutTitle", widget: "string" }
              - { label: "Sekojiet Mums Virsraksts", name: "followTitle", widget: "string" }
              - { label: "Kontaktu Virsraksts", name: "contactTitle", widget: "string" }
              - { label: "Adreses etiķete", name: "addressLabel", widget: "string" }
              - { label: "Autortiesību teksts", name: "rights", widget: "string" }
              - { label: "Privātuma politika saite", name: "privacy", widget: "string" }
              - { label: "Sīkdatņu politika saite", name: "cookies", widget: "string" }

          # About us section
          - label: "Par Mums (About Us)"
            name: "about"
            widget: "object"
            fields:
              - { label: "Poga Atpakaļ", name: "backBtn", widget: "string" }
              - { label: "Virsraksts", name: "title", widget: "string" }
              - { label: "Apakšvirsraksts", name: "subtitle", widget: "string" }
              - { label: "Izceltais teksts", name: "highlight", widget: "text" }
              - { label: "Rindkopa 1", name: "p1", widget: "text" }
              - { label: "Rindkopa 2", name: "p2", widget: "text" }
              - { label: "Rindkopa 3", name: "p3", widget: "text" }
              - { label: "Rindkopa 4", name: "p4", widget: "text" }
              - { label: "Rindkopa 5", name: "p5", widget: "text" }
              - { label: "Attēla 1 Tagline Rinda 1", name: "imageTaglineLine1", widget: "string", required: false }
              - { label: "Attēla 1 Tagline Rinda 2", name: "imageTaglineLine2", widget: "string", required: false }
              - { label: "Attēla 2 Tagline Rinda 1", name: "image3TaglineLine1", widget: "string", required: false }
              - { label: "Attēla 2 Tagline Rinda 2", name: "image3TaglineLine2", widget: "string", required: false }
              - { label: "Attēla 3 Tagline Rinda 1", name: "image4TaglineLine1", widget: "string", required: false }
              - { label: "Attēla 3 Tagline Rinda 2", name: "image4TaglineLine2", widget: "string", required: false }

          # Benefits section
          - label: "Ieguvumi (Kāpēc Izvēlēties Mūs)"
            name: "benefits"
            widget: "object"
            fields:
              - label: "Jautājums 1 - Piemērotība"
                name: "q1"
                widget: "object"
                fields:
                  - { label: "Virsraksts (daļa 1)", name: "title", widget: "string" }
                  - { label: "Virsraksts (daļa 2)", name: "subtitle", widget: "string" }
                  - { label: "Punkti", name: "items", widget: "list", fields: [
                      { label: "Virsraksts", name: "title", widget: "string" },
                      { label: "Apraksts", name: "desc", widget: "text" }
                    ] }
              - label: "Jautājums 2 - Priekšrocības"
                name: "q2"
                widget: "object"
                fields:
                  - { label: "Virsraksts (daļa 1)", name: "title", widget: "string" }
                  - { label: "Virsraksts (daļa 2)", name: "subtitle", widget: "string" }
                  - { label: "Virsraksts (daļa 3)", name: "suffix", widget: "string" }
                  - { label: "Virsraksts (daļa 4)", name: "suffix2", widget: "string" }
                  - { label: "Kopsavilkums", name: "desc", widget: "text" }
                  - { label: "Saraksta Ievads", name: "listPrefix", widget: "string" }
                  - { label: "Priekšrocības", name: "items", widget: "list", fields: [
                      { label: "Nosaukums", name: "title", widget: "string" },
                      { label: "Apraksts", name: "desc", widget: "text" }
                    ] }

          # Services summary on Homepage
          - label: "Pakalpojumu Kopsavilkums"
            name: "services"
            widget: "object"
            fields:
              - { label: "Virsraksts (daļa 1)", name: "title", widget: "string" }
              - { label: "Virsraksts (daļa 2)", name: "subtitle", widget: "string" }
              - { label: "Apraksts", name: "description", widget: "text" }
              - { label: "Pogas Teksts", name: "learnMore", widget: "string" }
              - { label: "Pakalpojumu saraksts", name: "items", widget: "list", fields: [
                  { label: "ID", name: "id", widget: "number" },
                  { label: "Virsraksts", name: "title", widget: "string" },
                  { label: "Apraksts", name: "desc", widget: "text" }
                ] }

          # Detailed Services page
          - label: "Pakalpojumu Detalizētā Lapa"
            name: "servicesPage"
            widget: "object"
            fields:
              - { label: "Poga Atpakaļ", name: "backBtn", widget: "string" }
              - { label: "Virsraksts", name: "title", widget: "string" }
              - { label: "Apakšvirsraksts", name: "subtitle", widget: "string" }
              - { label: "Kopējais apraksts", name: "description", widget: "text" }
              - { label: "Apraksta etiķete", name: "descriptionLabel", widget: "string" }
              - { label: "Pogas Lasīt vairāk teksts", name: "learnMore", widget: "string" }
              - { label: "PVN Norāde", name: "vatText", widget: "string" }
              - { label: "Pakalpojumi", name: "items", widget: "list", fields: [
                  { label: "ID", name: "id", widget: "number" },
                  { label: "Virsraksts", name: "title", widget: "string" },
                  { label: "Ievads", name: "intro", widget: "text" },
                  { label: "Saraksta punkti", name: "points", widget: "list", field: { label: "Punkts", name: "value", widget: "string" } },
                  { label: "Nobeigums", name: "outro", widget: "text", required: false },
                  { label: "Cenu sadaļas virsraksts", name: "costTitle", widget: "string" },
                  { label: "Cenas teksts", name: "costText", widget: "text" }
                ] }

          # Pricing page
          - label: "Sadarbības un Cenu Lapa"
            name: "pricingPage"
            widget: "object"
            fields:
              - { label: "Poga Atpakaļ", name: "backBtn", widget: "string" }
              - { label: "Virsraksts (daļa 1)", name: "title", widget: "string" }
              - { label: "Virsraksts (daļa 2)", name: "subtitle", widget: "string" }
              - { label: "Ievada apraksts", name: "description", widget: "text" }
              - { label: "Soļu sadaļas virsraksts", name: "stepsTitle", widget: "string" }
              - { label: "Sadarbības soļi", name: "steps", widget: "list", field: { label: "Solis", name: "value", widget: "string" } }
              - { label: "Pakalpojuma veidu virsraksts", name: "optionsTitle", widget: "string" }
              - { label: "Pakalpojuma veidu apakšvirsraksts", name: "optionsSubtitle", widget: "string" }
              - label: "Modelis A"
                name: "modelA"
                widget: "object"
                fields:
                  - { label: "Sadaļas nosaukums", name: "label", widget: "string" }
                  - { label: "Izcēlums (Badge)", name: "badge", widget: "string" }
                  - { label: "Virsraksts", name: "title", widget: "string" }
                  - { label: "Apraksts", name: "desc", widget: "text" }
                  - { label: "Pogas teksts", name: "btn", widget: "string" }
              - label: "Modelis B"
                name: "modelB"
                widget: "object"
                fields:
                  - { label: "Sadaļas nosaukums", name: "label", widget: "string" }
                  - { label: "Virsraksts", name: "title", widget: "string" }
                  - { label: "Apraksts", name: "desc", widget: "text" }
                  - { label: "Pogas teksts", name: "btn", widget: "string" }

          # FAQ page
          - label: "BUJ (Biežāk Uzdotie Jautājumi)"
            name: "faq"
            widget: "object"
            fields:
              - { label: "Poga Atpakaļ", name: "backBtn", widget: "string" }
              - { label: "Virsraksts (daļa 1)", name: "title", widget: "string" }
              - { label: "Virsraksts (daļa 2)", name: "subtitle", widget: "string" }
              - { label: "Poga Skatīt visas atbildes", name: "viewAll", widget: "string" }
              - label: "Jautājumi un Atbildes"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Jautājums", name: "q", widget: "string" }
                  - { label: "Atbilde (Viena teksta rindkopa vai saraksts)", name: "a", widget: "text" }

          # Cooperation process
          - label: "Sadarbības Process (mājaslapā)"
            name: "process"
            widget: "object"
            fields:
              - { label: "Virsraksts (daļa 1)", name: "title", widget: "string" }
              - { label: "Virsraksts (daļa 2)", name: "subtitle", widget: "string" }
              - { label: "Ievada apraksts", name: "desc", widget: "text" }
              - { label: "Soļi", name: "items", widget: "list", fields: [
                  { label: "Solis", name: "title", widget: "string" },
                  { label: "Apraksts", name: "desc", widget: "text" }
                ] }

          # Cookie banner
          - label: "Sīkdatņu Paziņojums"
            name: "cookieBanner"
            widget: "object"
            fields:

              - { label: "Paziņojuma teksts", name: "description", widget: "text" }
              - { label: "Poga - Apstiprināt visu", name: "acceptBtn", widget: "string" }
              - { label: "Poga - Noraidīt", name: "rejectBtn", widget: "string" }
              - { label: "Poga - Pielāgot izvēli", name: "settingsBtn", widget: "string" }

          # Contact page and business info
          - label: "Kontakti un Biznesa Informācija"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Poga Atpakaļ", name: "backBtn", widget: "string" }
              - { label: "Melnā banera Virsraksts", name: "title", widget: "string" }
              - { label: "Melnā banera Apakšvirsraksts", name: "subtitle", widget: "string" }
              - { label: "Sazināties Virsraksts", name: "formTitle", widget: "string" }
              - { label: "Sazināties Apakšvirsraksts", name: "formSubtitle", widget: "string" }
              - { label: "Formas Rāmja Virsraksts", name: "formBoxTitle", widget: "string" }
              - { label: "Lauks: Vārds, Uzvārds", name: "labelName", widget: "string" }
              - { label: "Lauks: Uzņēmums", name: "labelCompany", widget: "string" }
              - { label: "Lauks: E-pasts", name: "labelEmail", widget: "string" }
              - { label: "Lauks: Telefons", name: "labelPhone", widget: "string" }
              - { label: "Lauks: Ziņojums", name: "labelMessage", widget: "string" }
              - { label: "Datu apstrādes piekrišana (ievads)", name: "consentText", widget: "string" }
              - { label: "Datu apstrādes saites teksts", name: "privacyLink", widget: "string" }
              - { label: "Pogas teksts - Nosūtīt", name: "submitBtn", widget: "string" }
              - { label: "Pogas teksts - Sūta", name: "submitting", widget: "string" }
              - { label: "Pateicības loga virsraksts", name: "successTitle", widget: "string" }
              - { label: "Pateicības ziņojums", name: "successMessage", widget: "string" }
              - { label: "Poga Nosūtīt jaunu", name: "newRequestBtn", widget: "string" }
              - { label: "Sānu rāmja virsraksts", name: "infoTitle", widget: "string" }
              - { label: "Sānu rāmja apakšvirsraksts", name: "infoSubtitle", widget: "string" }
              - { label: "Etiķete: Zvaniet", name: "callUs", widget: "string" }
              - { label: "Etiķete: Rakstiet", name: "writeUs", widget: "string" }
              - { label: "Galvenā navigācijas poga", name: "contactBtn", widget: "string" }

          # Policies
          - label: "Privātuma Politika"
            name: "privacy"
            widget: "object"
            fields:
              - { label: "Virsraksts", name: "title", widget: "string" }
              - { label: "Apakšvirsraksts", name: "subtitle", widget: "string" }
              - { label: "Pēdējo reizi atjaunots", name: "lastUpdated", widget: "string" }
              - { label: "Sadaļas", name: "sections", widget: "list", fields: [
                  { label: "Sadaļas virsraksts", name: "title", widget: "string" },
                  { label: "Saturs", name: "content", widget: "text" }
                ] }
          - label: "Sīkdatņu Politika"
            name: "cookies"
            widget: "object"
            fields:
              - { label: "Virsraksts", name: "title", widget: "string" }
              - { label: "Apakšvirsraksts", name: "subtitle", widget: "string" }
              - { label: "Pēdējo reizi atjaunots", name: "lastUpdated", widget: "string" }
              - { label: "Sadaļas", name: "sections", widget: "list", fields: [
                  { label: "Sadaļas virsraksts", name: "title", widget: "string" },
                  { label: "Saturs", name: "content", widget: "text" }
                ] }

  # 2. Articles (Noderīgi / Blogs)
  - name: "articles_collection"
    label: "Raksti (Noderīgi)"
    i18n: false
    files:
      - name: "articles"
        label: "Visi Raksti"
        file: "src/data/articles.json"
        fields:
          - label: "Saraksts ar Rakstiem"
            name: "articles"
            widget: "list"
            fields:
              - { label: "ID (secīgs skaitlis)", name: "id", widget: "number" }
              - { label: "Slug (Unikāla saite, piem: jaunumi-2025)", name: "slug", widget: "string" }
              - { label: "Attēls (webp)", name: "image", widget: "image" }
              - { label: "Nosaukums", name: "title", widget: "string" }
              - { label: "Īss izvilkums (Sarakstam)", name: "excerpt", widget: "text" }
              - { label: "Rindkopu saturs", name: "content", widget: "list", field: { label: "Rindkopa", name: "value", widget: "text" } }

  # 3. Documents (Līgumu paraugi)
  - name: "documents_collection"
    label: "Līgumu Paraugi"
    i18n: false
    files:
      - name: "documents"
        label: "Visi Līgumi"
        file: "src/data/documents.json"
        fields:
          - label: "Līgumu paraugu saraksts"
            name: "documents"
            widget: "list"
            fields:
              - { label: "Kods / ID (piem: telpu-ires-ligums)", name: "id", widget: "string" }
              - { label: "Nosaukums", name: "title", widget: "object", fields: [
                  { label: "Latviski", name: "lv", widget: "string" },
                  { label: "English", name: "en", widget: "string" },
                  { label: "Русский", name: "ru", widget: "string" }
                ] }
              - { label: "Cena (Eiro centos vai eiro, piem: 15 vai 15.00)", name: "price", widget: "number", value_type: "float" }
              - { label: "Vai tas ir pakalpojums (Service)?", name: "isService", widget: "boolean", default: false, required: false }

  # 4. Custom Pages (Dinamiskās lapas)
  - name: "custom_pages_collection"
    label: "Dinamiskās Lapas"
    i18n: false
    files:
      - name: "pages"
        label: "Visas Lapas"
        file: "src/data/pages.json"
        fields:
          - label: "Lapu saraksts"
            name: "pages"
            widget: "list"
            fields:
              - { label: "Slug (Saites adrese, piem: galerijas)", name: "slug", widget: "string" }
              - { label: "Nosaukums / Virsraksts", name: "title", widget: "string" }
              - { label: "Saturs (Apraksts)", name: "content", widget: "markdown" }
              - label: "Attēlu galerija"
                name: "images"
                widget: "list"
                required: false
                fields:
                  - { label: "Attēls", name: "image", widget: "image" }
                  - { label: "Attēla paraksts", name: "caption", widget: "string", required: false }
  </script>

  <script>
    // Tell Decap CMS to wait for our manual configuration initialization
    window.CMS_MANUAL_INIT = true;
  </script>

  <!-- Decap CMS Script CDN -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Register custom CSS for visual style in preview pane
    CMS.registerPreviewStyle("/admin/preview-style.css");

    // Initialize CMS using the robust inline configuration parsed via jsyaml
    try {
      const yamlContent = document.getElementById('cms-config').textContent;
      const config = jsyaml.load(yamlContent);
      CMS.init({ config });
      console.log("CMS veiksmīgi inicializēts ar iebūvēto konfigurāciju!");
    } catch (e) {
      console.error("Kļūda, ielādējot iebūvēto CMS konfigurāciju:", e);
      // Fallback in case of parsing failures
      if (typeof CMS !== 'undefined') {
        CMS.init();
      }
    }

    // Track manual login actions to reload only when the user explicitly clicks the login button and completes it
    let isManualLogin = false;

    // Setup click handler for custom login button
    document.getElementById("custom-login-btn").addEventListener("click", function() {
      if (window.netlifyIdentity) {
        isManualLogin = true;
        window.netlifyIdentity.open("login");
      }
    });

    // Handle Netlify Identity authentication states cleanly and robustly
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function(user) {
        if (!user) {
          document.body.classList.add("cms-logged-out");
        } else {
          document.body.classList.remove("cms-logged-out");
        }
      });

      window.netlifyIdentity.on("login", function(user) {
        document.body.classList.remove("cms-logged-out");
        if (window.netlifyIdentity) {
          window.netlifyIdentity.close();
        }
        // Only trigger document reload if the user manually logged in, preventing infinite loops on initial load session restore!
        if (isManualLogin) {
          isManualLogin = false;
          setTimeout(function() {
            document.location.reload();
          }, 100);
        }
      });

      window.netlifyIdentity.on("logout", function() {
        document.body.classList.add("cms-logged-out");
        var ncRoot = document.getElementById("nc-root");
        if (ncRoot) {
          ncRoot.style.display = "none";
        }
        setTimeout(function() {
          document.location.reload();
        }, 100);
      });
    }

    // React iestatījumi priekšskatījuma logiem
    const h = window.h;

    // 1. Dinamisko lapu priekšskatījuma template
    const PagePreview = function(props) {
      const entry = props.entry;
      const pages = entry.getIn(['data', 'pages']);
      if (!pages) return h('div', { style: { padding: '20px', color: '#b38207' } }, 'Nav izveidotu lapu.');

      return h('div', { className: 'pages-preview-container' },
        pages.map(function(page, idx) {
          const title = page.get('title') || 'Nosaukums';
          const slug = page.get('slug') || '';
          const content = page.get('content') || '';
          const images = page.get('images') || window.Immutable.List();

          return h('div', { key: idx, className: 'custom-page-card' },
            h('div', { className: 'page-header' },
              h('span', { className: 'page-badge' }, 'Dinamiskā lapa'),
              h('h1', null, title),
              h('span', { className: 'page-slug' }, '/lapa/' + slug)
            ),
            h('div', { className: 'page-content-wrapper' },
              h('p', { className: 'page-content-text' }, content)
            ),
            images.size > 0 ? h('div', { className: 'gallery-section' },
              h('h3', null, 'Attēlu galerija'),
              h('div', { className: 'gallery-grid' },
                images.map(function(imgObj, imgIdx) {
                  const src = imgObj.get('image');
                  const caption = imgObj.get('caption');
                  return h('div', { key: imgIdx, className: 'gallery-item' },
                    h('img', { src: src }),
                    caption ? h('p', { className: 'image-caption' }, caption) : null
                  );
                })
              )
            ) : null
          );
        })
      );
    };

    // 2. Rakstu (Blogs) priekšskatījuma template
    const ArticlesPreview = function(props) {
      const entry = props.entry;
      const articles = entry.getIn(['data', 'articles']);
      if (!articles) return h('div', { style: { padding: '20px', color: '#b38207' } }, 'Nav rakstu.');

      return h('div', { className: 'articles-preview-container' },
        articles.map(function(article, idx) {
          const title = article.get('title') || 'Nosaukums';
          const excerpt = article.get('excerpt') || '';
          const image = article.get('image') || '';
          const content = article.get('content') || window.Immutable.List();

          return h('div', { key: idx, className: 'article-card' },
            h('div', { className: 'article-header-grid' },
              image ? h('div', { className: 'article-img-wrapper' }, h('img', { src: image })) : null,
              h('div', { className: 'article-meta' },
                h('span', { className: 'article-badge' }, 'RAKSTS / NODERĪGI'),
                h('h2', null, title),
                h('p', { className: 'article-excerpt' }, excerpt)
              )
            ),
            h('div', { className: 'article-body' },
              content.size > 0 ? content.map(function(paragraph, pIdx) {
                const text = typeof paragraph === 'string' ? paragraph : (paragraph.get('value') || '');
                return h('p', { key: pIdx, className: 'article-paragraph' }, text);
              }) : null
            )
          );
        })
      );
    };

    // 3. Mājaslapas tekstu un sadaļu priekšskatījuma template
    const TranslationsPreview = function(props) {
      const entry = props.entry;
      const data = entry.get('data');
      if (!data) return h('div', { style: { padding: '20px', color: '#b38207' } }, 'Ielādē datus...');

      const hero = data.get('hero') || window.Immutable.Map();
      const about = data.get('about') || window.Immutable.Map();
      const benefits = data.get('benefits') || window.Immutable.Map();
      const services = data.get('services') || window.Immutable.Map();

      const q1Items = benefits.getIn(['q1', 'items']) || window.Immutable.List();
      const serviceItems = services.get('items') || window.Immutable.List();

      return h('div', { className: 'site-preview-wrapper' },
        h('header', { className: 'mock-header' },
          h('div', { className: 'logo' }, 'AVENUE GROUP'),
          h('nav', null,
            h('span', null, 'Sākums'),
            h('span', null, 'Pakalpojumi'),
            h('span', null, 'Līgumu paraugi'),
            h('span', null, 'Noderīgi'),
            h('span', null, 'BUJ'),
            h('span', null, 'Kontakti')
          )
        ),
        h('section', { className: 'mock-hero' },
          h('div', { className: 'hero-content' },
            h('h1', null,
              h('span', null, hero.get('title') || 'Virsraksts 1 '),
              h('span', { className: 'gold-text' }, hero.get('subtitle') || 'Virsraksts 2')
            ),
            h('p', { className: 'hero-desc' }, hero.get('description') || 'Apraksts...'),
            h('div', { className: 'hero-buttons' },
              h('button', { className: 'gold-btn' }, hero.get('servicesBtn') || 'Skatīt pakalpojumus'),
              h('button', { className: 'outline-btn' }, hero.get('contactBtn') || 'Sazināties')
            )
          )
        ),
        h('section', { className: 'mock-about' },
          h('div', { className: 'section-title-wrap' },
            h('h2', null, about.get('title') || 'Par mums'),
            h('p', { className: 'section-subtitle' }, about.get('subtitle') || 'Apakšvirsraksts')
          ),
          h('div', { className: 'about-grid' },
            h('div', { className: 'about-text-side' },
              about.get('highlight') ? h('p', { className: 'about-highlight' }, about.get('highlight')) : null,
              about.get('p1') ? h('p', null, about.get('p1')) : null,
              about.get('p2') ? h('p', null, about.get('p2')) : null,
              about.get('p3') ? h('p', null, about.get('p3')) : null
            ),
            h('div', { className: 'about-decor-side' },
              h('div', { className: 'decor-badge' },
                h('span', null, about.get('imageTaglineLine1') || 'Kvalitāte'),
                h('span', { className: 'gold-text' }, about.get('imageTaglineLine2') || 'Garantija')
              )
            )
          )
        ),
        q1Items.size > 0 ? h('section', { className: 'mock-benefits' },
          h('h2', null,
            h('span', null, benefits.getIn(['q1', 'title']) || 'Kāpēc '),
            h('span', { className: 'gold-text' }, benefits.getIn(['q1', 'subtitle']) || 'izvēlēties mūs?')
          ),
          h('div', { className: 'benefits-list' },
            q1Items.map(function(item, idx) {
              return h('div', { key: idx, className: 'benefit-card' },
                h('h4', null, item.get('title')),
                h('p', null, item.get('desc'))
              );
            })
          )
        ) : null,
        serviceItems.size > 0 ? h('section', { className: 'mock-services' },
          h('h2', null,
            h('span', null, services.get('title') || 'Mūsu '),
            h('span', { className: 'gold-text' }, services.get('subtitle') || 'Pakalpojumi')
          ),
          h('p', { className: 'services-desc' }, services.get('description')),
          h('div', { className: 'services-grid' },
            serviceItems.map(function(item, idx) {
              return h('div', { key: idx, className: 'service-box' },
                h('span', { className: 'box-number' }, '0' + (idx + 1)),
                h('h4', null, item.get('title')),
                h('p', null, item.get('desc'))
              );
            })
          )
        ) : null
      );
    };

    // Reģistrējam veidnes
    CMS.registerPreviewTemplate("custom_pages_collection", PagePreview);
    CMS.registerPreviewTemplate("articles_collection", ArticlesPreview);
    CMS.registerPreviewTemplate("translations", TranslationsPreview);
  </script>
</body>
</html>
