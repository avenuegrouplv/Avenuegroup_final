                      - { name: subtitle, label: Subtitle, type: text }
                      - { name: suffix, label: Suffix, type: text }
                      - { name: suffix2, label: Suffix 2, type: text }
                      - { name: desc, label: Description, type: textarea }
                      - { name: listPrefix, label: List Prefix, type: text }
